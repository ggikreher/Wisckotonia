services:
  db:
    image: postgres:16-alpine
    container_name: wisckotonia-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: wiscko
      POSTGRES_PASSWORD: wiscko
      POSTGRES_DB: wisckotonia
    ports:
      - "5433:5432"
    volumes:
      - wisckotonia_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiscko -d wisckotonia"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  wisckotonia_pg:
